markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      # 默认 slugify 会把中文从标题中剥离（"5.1 参数说明" 只剩 "51"，纯中文标题生成空 id），
      # 导致上游文档里的中文锚点链接（如 #51-参数说明）全部失效。改用 Unicode slugify 后
      # 生成的锚点与上游链接写法一致。
      slugify: !!python/object/apply:pymdownx.slugs.slugify {kwds: {case: lower}}
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra:
  social:
    - icon: fontawesome/brands/git-alt
      link: https://gitcode.com/Ascend/mstt
